# One-shot: set the repo description and topics from CI, then delete this file.
# The About box is API-only and a local SSH key cannot reach the API, so this
# borrows the runner's GITHUB_TOKEN instead.
name: set repo metadata
on: push

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - name: Set description
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description="A course player where the course is a web page, not a video — so it can answer back. Ask mid-playback: if it's covered you get the section and timestamp; if not, it writes a new slide, narrates it, and inserts it. Python stdlib, zero runtime deps, local TTS, optional R2 media." \
            && echo "DESCRIPTION_OK" || echo "DESCRIPTION_FAILED"

      - name: Set topics
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/topics" \
            -f names[]=education -f names[]=edtech -f names[]=e-learning \
            -f names[]=courseware -f names[]=course-player -f names[]=interactive-learning \
            -f names[]=ai-education -f names[]=llm -f names[]=openrouter \
            -f names[]=text-to-speech -f names[]=kokoro-tts -f names[]=python \
            -f names[]=self-hosted -f names[]=cloudflare-r2 -f names[]=html5-audio \
            && echo "TOPICS_OK" || echo "TOPICS_FAILED"
